<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Clef-Flash Vision Decision Studio (Jev / System One)</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --border: #2e3346;
      --accent: #50c878;
      --text: #eaeaea;
      --muted: #8b92a5;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); }
    h1 { margin: 0 0 6px 0; font-size: 22px; color: var(--accent); }
    p.sub { margin: 0 0 20px 0; color: var(--muted); font-size: 14px; }
    .grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    #dropzone {
      border: 2px dashed var(--border); border-radius: 8px; height: 240px;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      cursor: pointer; overflow: hidden; position: relative; transition: 0.2s;
    }
    #dropzone.dragover { border-color: var(--accent); background: rgba(80, 200, 120, 0.08); }
    #dropzone img { max-width: 100%; max-height: 100%; object-fit: contain; }
    textarea {
      width: 100%; height: 240px; background: #12141c; color: #a9dc76;
      border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 12px;
      margin-top: 8px; resize: vertical;
    }
    button {
      margin-top: 12px; width: 100%; padding: 10px; background: var(--accent);
      color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .q-block { border-bottom: 1px solid var(--border); padding: 12px 0; }
    .q-block:last-child { border-bottom: none; }
    .badge { background: #2b3147; color: var(--accent); padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 8px; }
    .bar-wrap { background: #12141c; height: 8px; border-radius: 4px; overflow: hidden; margin: 4px 0 8px 0; }
    .bar-fill { background: var(--accent); height: 100%; }
    pre { background: #12141c; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; color: #dcdcaa; }
  </style>
</head>
<body>

  <h1>⚡ Clef-Flash 視覺決策
